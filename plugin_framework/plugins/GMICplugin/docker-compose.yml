# plugins/gmic/docker-compose.yml

services:
  gmic-plugin:
    image: "preprocessing:gmic"
    
    build:
      context: .

    container_name: preprocessing-gmic

    ports:
      - "8003:8003"

    environment:
      PYTHONPATH: /plugin
      GMIC_DEVICE: gpu 
    
    gpus: all
    
    volumes:
    - ./tmp/:/tmp/
    
    labels:
      ai.plugin: "true"
      ai.task: "explainability"
      ai.port: "8003"